name: 项目与研究资源推荐
description: 推荐项目，或报告实际运行与复现结果
title: "[项目候选/复现] "
body:
  - type: markdown
    attributes:
      value: 请提供官方链接，简要说明项目解决的问题、核心方法和主要用途。运行过项目的读者可补充实验结果。
  - type: input
    id: repository
    attributes:
      label: 官方仓库或项目页
      placeholder: https://github.com/...
    validations:
      required: true
  - type: textarea
    id: role
    attributes:
      label: 主要用途与核心方法
      description: 简要说明项目的输入、输出、方法和适用任务。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境与复现步骤
      description: 如有实际运行经历，可填写硬件、软件版本和操作步骤。
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: 实验结果
      description: 如有实际运行经历，可附日志、配置、视频和遇到的问题。
    validations:
      required: false
